name: Publish Docker image

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare tags
        id: prep
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          short_sha="${GITHUB_SHA::7}"
          version="${GITHUB_REF_NAME#v}"
          tags="${image}:latest-${{ matrix.suffix }},${image}:sha-${short_sha}-${{ matrix.suffix }}"

          if [ "${GITHUB_EVENT_NAME}" = "release" ] || [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags="${tags},${image}:${version}-${{ matrix.suffix }},${image}:rolling-${{ matrix.suffix }}"
          else
            version="${short_sha}"
          fi

          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Palworld Server Dashboard
            org.opencontainers.image.description=Browser-based admin dashboard for managing and monitoring Palworld dedicated servers through the REST API.
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.prep.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

  publish-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch tags
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          short_sha="${GITHUB_SHA::7}"
          version="${GITHUB_REF_NAME#v}"
          tags=(--tag "${image}:latest" --tag "${image}:sha-${short_sha}")
          sources=("${image}:sha-${short_sha}-amd64" "${image}:sha-${short_sha}-arm64")

          if [ "${GITHUB_EVENT_NAME}" = "release" ] || [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags+=(--tag "${image}:${version}" --tag "${image}:rolling")
            sources=("${image}:${version}-amd64" "${image}:${version}-arm64")
          fi

          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
